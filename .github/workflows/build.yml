# Builds the Windows setup file on GitHub's Windows computers.
# The program is compiled to machine code with Nuitka (much harder to take apart than packed Python), then the
# finished program runs its own self-test on Windows (encryption, Windows key lock, PDFs, Excel, screen).
# Runs on every push to main and to test/* branches. Only main makes releases: when APP_VERSION in
# app/config.py is new, it creates a release "vX.Y.Z" with the setup file.
name: Build Windows setup
on:
  push:
    branches: [main, "test/**"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    env:
      HAS_DOWNLOADS_TOKEN: ${{ secrets.DOWNLOADS_TOKEN != '' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Read version
        id: ver
        shell: pwsh
        run: |
          $v = (Select-String -Path app\config.py -Pattern 'APP_VERSION = "([0-9.]+)"').Matches[0].Groups[1].Value
          $i = (Select-String -Path installer.iss -Pattern '#define MyAppVersion "([0-9.]+)"').Matches[0].Groups[1].Value
          if ($v -ne $i) { throw "Version mismatch: app/config.py says $v but installer.iss says $i" }
          gh release view "v$v" --repo "${{ github.repository }}" *> $null
          $new = if ($LASTEXITCODE -eq 0) { "false" } else { "true" }
          $global:LASTEXITCODE = 0
          "version=$v" >> $env:GITHUB_OUTPUT
          "new=$new" >> $env:GITHUB_OUTPUT
          Write-Host "Version $v (new release: $new)"
      - name: Install tools
        run: python -m pip install -r requirements.txt "nuitka==4.3.4"
      - name: Run tests
        run: python tests/test_core.py
      - name: Build program (compiled with Nuitka)
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}.0"
          python -m nuitka --standalone --assume-yes-for-downloads --msvc=latest --windows-console-mode=disable `
            --enable-plugin=tk-inter --include-package=app --include-package=reportlab.graphics.barcode `
            --include-package-data=reportlab --include-package=defusedxml --include-package=pypdf --include-data-dir=assets=assets `
            --windows-icon-from-ico=assets\app.ico --company-name="Robin Mishra" `
            --product-name="Beer and Liquor Pricing" --file-description="Beer and Liquor Pricing" `
            --file-version=$v --product-version=$v --copyright="Copyright (C) 2026 Robin Mishra" `
            --output-dir=build_n --output-filename=BevMargin.exe main.py
          if ($LASTEXITCODE -ne 0) { throw "Nuitka build failed" }
          New-Item -ItemType Directory -Force dist | Out-Null
          Move-Item build_n\main.dist dist\BevMargin
      - name: Self-test the built program on Windows
        shell: pwsh
        run: |
          $out = "$pwd\selftest.json"
          $p = Start-Process dist\BevMargin\BevMargin.exe -ArgumentList "--selftest", "`"$out`"" -Wait -PassThru
          if (Test-Path $out) { Get-Content $out } else { Write-Host "no result file" }
          if ($p.ExitCode -ne 0) { throw "Self-test failed (exit $($p.ExitCode))" }
      - name: Build setup file
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
          Get-ChildItem Output
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-setup-${{ steps.ver.outputs.version }}
          path: |
            Output/*.exe
            selftest.json
      - name: Private release (setup file)
        if: steps.ver.outputs.new == 'true' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          $setup = (Get-ChildItem Output\*.exe | Select-Object -First 1).FullName
          gh release create "v${{ steps.ver.outputs.version }}" "$setup" --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "v${{ steps.ver.outputs.version }}" --notes-file RELEASE_NOTES.md
      - name: Publish setup file to the public downloads page (optional token)
        if: steps.ver.outputs.new == 'true' && env.HAS_DOWNLOADS_TOKEN == 'true' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.DOWNLOADS_TOKEN }}
        run: |
          $setup = (Get-ChildItem Output\*.exe | Select-Object -First 1).FullName
          gh release create "beer-v${{ steps.ver.outputs.version }}" "$setup" --repo mrobin1629-create/store-apps-downloads --title "Beer and Liquor Pricing v${{ steps.ver.outputs.version }}" --notes-file RELEASE_NOTES.md
